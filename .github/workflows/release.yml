name: Release Docker Images

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "LICENSE.txt"
      - "**/*.md"
      - "docker-compose*.yml"
      - ".github/**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: mcp-ddg-research
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Test and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      should_publish: ${{ steps.release_metadata.outputs.should_publish }}
      release_commit_sha: ${{ steps.release_metadata.outputs.release_commit_sha }}
      release_tag: ${{ steps.release_metadata.outputs.release_tag }}
      release_version: ${{ steps.release_metadata.outputs.release_version }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin checkout to workflow SHA
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git reset --hard "$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          else
            git reset --hard "${GITHUB_SHA}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Compile
        run: python -m compileall -q src tests

      - name: Build package
        run: python -m build

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:ci" .

      - name: Semantic Release
        if: github.ref_type == 'branch'
        id: semantic
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
          changelog: "false"

      - name: Resolve release metadata
        id: release_metadata
        env:
          SEMANTIC_RELEASED: ${{ steps.semantic.outputs.released || 'false' }}
          SEMANTIC_COMMIT_SHA: ${{ steps.semantic.outputs.commit_sha }}
          SEMANTIC_TAG: ${{ steps.semantic.outputs.tag }}
          SEMANTIC_VERSION: ${{ steps.semantic.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            commit_sha="$(git rev-list -n 1 "${tag}")"

            {
              echo "should_publish=true"
              echo "release_commit_sha=${commit_sha}"
              echo "release_tag=${tag}"
              echo "release_version=${version}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${SEMANTIC_RELEASED}" = "true" ]; then
            {
              echo "should_publish=true"
              echo "release_commit_sha=${SEMANTIC_COMMIT_SHA}"
              echo "release_tag=${SEMANTIC_TAG}"
              echo "release_version=${SEMANTIC_VERSION}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_publish=false"
            echo "release_commit_sha=${GITHUB_SHA}"
            echo "release_tag="
            echo "release_version="
          } >> "$GITHUB_OUTPUT"

  publish_images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.release_commit_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image metadata
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GHCR_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          ghcr_repository="${GHCR_REPOSITORY,,}"
          {
            echo "dockerhub_image=${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            echo "ghcr_image=ghcr.io/${ghcr_repository}"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.dockerhub_image }}:latest
            ${{ steps.image.outputs.dockerhub_image }}:${{ needs.release.outputs.release_tag }}
            ${{ steps.image.outputs.ghcr_image }}:latest
            ${{ steps.image.outputs.ghcr_image }}:${{ needs.release.outputs.release_tag }}
          labels: |
            org.opencontainers.image.title=mcp-ddg-research
            org.opencontainers.image.description=Lightweight MCP server for DuckDuckGo HTML search with optional ddgs mode, safe webpage fetching, caching, and clean text extraction.
            org.opencontainers.image.version=${{ needs.release.outputs.release_tag }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.revision=${{ needs.release.outputs.release_commit_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
