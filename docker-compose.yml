services:
  ddg-research:
    build: .
    image: mcp-ddg-research:local
    container_name: mcp-ddg-research
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      MCP_CACHE_DIR: /data/cache
      DDG_CACHE_TTL_SECONDS: "21600"
      FETCH_CACHE_TTL_SECONDS: "7200"
      DDG_TIMEOUT_SECONDS: "15"
      FETCH_TIMEOUT_SECONDS: "15"
      MAX_CONCURRENCY: "5"

      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"

      MCP_ALLOWED_HOSTS: "*"
      MCP_ALLOWED_ORIGINS: "*"

      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-change-me}
