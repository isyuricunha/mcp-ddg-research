[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ddg-research"
version = "0.3.0"
description = "Lightweight MCP server for DuckDuckGo search with HTML fallback, safe webpage fetching, caching, and clean text extraction."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "mcp-ddg-research contributors" }
]
dependencies = [
  "beautifulsoup4",
  "ddgs",
  "httpx",
  "mcp[cli]",
  "pydantic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/mcp-ddg-research/mcp-ddg-research"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ddg_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
