[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ddg-research"
version = "0.5.1"
description = "Lightweight MCP server for DuckDuckGo HTML search with optional ddgs mode, safe webpage fetching, caching, and clean text extraction."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "mcp-ddg-research contributors" }
]
dependencies = [
  "beautifulsoup4",
  "ddgs",
  "httpx",
  "mcp[cli]",
  "pydantic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/isyuricunha/mcp-ddg-research"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ddg_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.semantic_release]
allow_zero_version = true
build_command = "python -m pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/mcp_ddg_research/__init__.py:__version__"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
